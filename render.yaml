services:
  - type: web
    name: codecraft-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: CLIENT_ORIGIN
        sync: false        # Set this in Render dashboard to your Vercel URL
      - key: MONGO_URI
        sync: false        # Set in Render dashboard
      - key: REDIS_URL
        sync: false        # Set in Render dashboard
      - key: GLOT_API_KEY
        sync: false        # Set in Render dashboard
